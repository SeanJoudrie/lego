<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collection</title>
<style>
  :root {
    /* A codex: aged paper, brown ink, a little gilt. */
    --bg:#ddceb0; --page:#f0e7d3; --panel:#f6efdf; --panel-2:#e6dac1;
    --line:#c3ad86; --line-soft:#d8c8a8;
    --text:#2f2417; --dim:#6d5c43; --faint:#95805e;
    --good:#3f6b48; --bad:#96302a; --neutral:#5f4585;
    --gold:#9a7320; --accent:#8a4527;
    --radius:4px;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }   /* beats .controls{display:grid} */
  body {
    margin:0; color:var(--text);
    background:var(--bg);
    font:16px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
         "Times New Roman", serif;
    -webkit-font-smoothing:antialiased;
  }
  /* The page itself: a sheet of paper laid on the board, with a faint tooth to
     it. Both layers are gradients, so there is no image to load. */
  .wrap {
    background:
      repeating-linear-gradient(94deg, rgba(120,95,60,.030) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(6deg, rgba(120,95,60,.022) 0 3px, transparent 3px 7px),
      var(--page);
    border-left:1px solid var(--line-soft); border-right:1px solid var(--line-soft);
    box-shadow:0 0 0 1px rgba(90,70,45,.06), 0 18px 60px rgba(60,44,26,.18);
  }
  h1, h2, h3, .info h2, .lore h2 { font-weight:600; }
  /* The page is a fixed sheet now: header and controls stay put, and the rail
     underneath them holds one deck per side. Each deck scrolls on its own, so
     where you were on the good side is still there when you swipe back. */
  html, body { height:100%; }
  .wrap {
    max-width:1400px; margin:0 auto; padding:34px 28px 0;
    height:100vh; height:100dvh; display:flex; flex-direction:column;
  }
  .wrap > header, .wrap > .bar, .wrap > .controls, .wrap > .sides { flex:0 0 auto; }

  /* ---------- the two sides ---------- */
  .sides {
    display:flex; gap:0; margin:0 0 2px;
    border-bottom:2px solid var(--line);
  }
  .sides button {
    flex:1 1 0; background:none; border:0; border-bottom:2px solid transparent;
    margin-bottom:-2px; padding:9px 10px 10px; font:inherit; font-size:12px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    cursor:pointer; display:flex; align-items:baseline; justify-content:center; gap:8px;
  }
  .sides button b { font-weight:500; letter-spacing:.04em; font-size:12px; opacity:.7;
                    font-variant-numeric:tabular-nums; }
  .sides button:hover { color:var(--accent); }
  .sides button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); }
  .sides button[aria-selected="true"] b { opacity:.85; }

  /* The rail itself never scrolls vertically - it pages sideways, one deck at
     a time, and each deck carries its own vertical scroll. */
  .rail {
    flex:1 1 auto; min-height:0;
    display:flex; gap:26px;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; overscroll-behavior-x:contain;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .rail::-webkit-scrollbar { display:none; }

  /* Once you are actually reading a deck the title row has done its job, so it
     folds away and gives the height back to the figures. Coming back to the top
     of a deck brings it straight back. */
  .wrap > header, .wrap > .bar { transition:height .16s ease, opacity .16s ease, margin .16s ease; }
  .wrap.condensed > header {
    height:0; margin:0; padding:0; opacity:0; overflow:hidden; border-bottom-width:0;
  }
  .deck {
    flex:0 0 100%; min-width:0;
    scroll-snap-align:start; scroll-snap-stop:always;
    overflow-y:auto; overscroll-behavior-y:contain;
    padding:16px 0 90px; scrollbar-width:thin;
  }

  /* ---------- header ---------- */
  header {
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
    border-bottom:2px solid var(--line); padding-bottom:14px; margin-bottom:18px;
  }
  h1 { font-size:30px; margin:0; letter-spacing:.01em; }
  .count { color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; }
  .lorebtn { margin-left:auto; background:var(--panel); border:1px solid var(--line);
             color:var(--dim); border-radius:var(--radius); padding:8px 14px;
             font:inherit; font-size:13px; cursor:pointer;
             letter-spacing:.05em; text-transform:uppercase; }
  .lorebtn:hover { border-color:var(--accent); color:var(--accent); background:var(--panel-2); }
  .lore { padding:26px 30px 30px; max-width:640px; }
  .lore h2 { margin:0 0 20px; font-size:22px; letter-spacing:-.01em; }
  .lore section { margin-bottom:22px; }
  .lore h3 { margin:0 0 6px; font-size:15px; color:var(--accent); font-weight:600; }
  .lore p { margin:0; color:var(--text); white-space:pre-wrap; font-size:15px; }

  /* ---------- controls ---------- */
  .bar { display:flex; gap:9px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .bar .search { flex:1 1 240px; }
  .bar select { flex:0 0 auto; width:auto; max-width:200px; }
  .toggle, .shuffle {
    flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--dim);
    border-radius:var(--radius); padding:9px 14px; font:inherit; font-size:13px;
    cursor:pointer; white-space:nowrap; letter-spacing:.04em;
  }
  .toggle:hover, .shuffle:hover { color:var(--accent); border-color:var(--accent); background:var(--panel-2); }
  .toggle[aria-expanded="true"] { background:var(--panel-2); color:var(--text); }
  .toggle.on { border-color:var(--accent); color:var(--accent); background:var(--panel-2); }
  .clear { background:none; border:0; color:var(--faint); font:inherit; font-size:12.5px;
           cursor:pointer; text-decoration:underline; padding:8px 4px; justify-self:start; }
  .clear:hover { color:var(--accent); }

  /* One labelled cell per control, in as many columns as fit. Keeps the panel
     to two or three tidy rows instead of a wall of loose dropdowns. */
  .controls {
    display:grid; gap:12px 14px;
    grid-template-columns:repeat(auto-fit, minmax(165px, 1fr));
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 15px 15px; margin-bottom:22px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .fld { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .fld > span { font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
                color:var(--faint); font-weight:600; }
  .search {
    flex:1 1 220px; min-width:0;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius); padding:9px 12px; font:inherit; font-size:15px;
  }
  .search::placeholder { color:var(--faint); }
  .search:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  select {
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius); padding:8px 9px; font:inherit; font-size:13.5px;
    width:100%; min-width:0;
  }
  .seg { display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .seg button {
    flex:1 1 0; background:var(--panel-2); border:0; border-right:1px solid var(--line);
    color:var(--dim); padding:8px 10px; font:inherit; font-size:13px; cursor:pointer;
    white-space:nowrap;
  }
  .seg button:last-child { border-right:0; }
  .seg button:hover { color:var(--accent); }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--panel); font-weight:600; }

  /* ---------- density control ---------- */
  .dens { display:flex; align-items:center; gap:8px; flex:0 0 auto;
          background:var(--panel); border:1px solid var(--line);
          border-radius:var(--radius); padding:6px 11px; }
  .dens input[type=range] { width:96px; accent-color:var(--accent); }
  .dens b { color:var(--dim); font-size:12px; font-weight:600; min-width:1.2em;
            text-align:center; font-variant-numeric:tabular-nums; }

  /* ---------- plates: the hand-picked run at the top ---------- */
  .plates { margin-bottom:26px; }
  .plates > h2 {
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    margin:0 0 2px; font-weight:600;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .plates > h2 em { font-style:italic; font-size:12.5px; letter-spacing:0;
                    text-transform:none; color:var(--faint); font-weight:400; }
  .plates .strip {
    display:flex; align-items:flex-start; gap:14px; overflow-x:auto; padding:12px 2px 14px;
    border-top:1px solid var(--line); border-bottom:2px solid var(--line);
    scroll-snap-type:x proximity; scrollbar-width:thin;
  }
  .plate {
    flex:0 0 172px; scroll-snap-align:start;
    background:none; border:0; padding:0; font:inherit; color:inherit;
    cursor:pointer; text-align:left;
  }
  .plate .frame {
    display:block; aspect-ratio:4/5; position:relative; overflow:hidden;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 2px 0 rgba(120,95,60,.18);
  }
  .plate .frame img { position:absolute; inset:0; width:100%; height:100%;
                      object-fit:cover; object-position:50% 12%; }
  .plate .frame img.wide { object-fit:contain; object-position:50% 50%; }
  .plate b { display:block; font-size:14px; font-weight:600; margin:9px 0 2px; line-height:1.25; }
  .plate i { display:block; font-style:italic; font-size:12.5px; line-height:1.4;
             color:var(--dim); }
  .plate:hover .frame { border-color:var(--accent); }
  .plate:hover b { color:var(--accent); }
  .plate:focus-visible .frame { outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- grid ---------- */
  .grid {
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  }
  /* tighter layouts when the cards get narrow - driven by measured card
     width, not column count, so 7 across on a desktop still reads fine */
  .grid.small .meta { padding:6px 7px 7px; }
  .grid.small .meta h3 {
    font-size:11px; line-height:1.15; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .grid.small .card .variant, .grid.small .row,
  .grid.small .custom-tag, .grid.small .theme-tag { display:none; }
  .grid.tiny .meta, .grid.tiny .custom-tag, .grid.tiny .theme-tag { display:none; }
  .grid.tiny .flag { width:7px; height:7px; top:5px; left:5px; box-shadow:0 0 0 2px rgba(246,239,223,.85); }

  /* A full-width rule across the grid where the living stop and the lost
     begin, with the label sitting under the line. */
  .sec {
    grid-column:1 / -1;
    margin:22px 0 2px; padding-top:10px;
    border-top:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    font-size:11px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--dim);
  }
  .sec b { font-weight:500; letter-spacing:.06em; opacity:.75; }
  .grid.small .sec { margin:16px 0 0; }
  .grid.tiny .sec { margin:12px 0 0; font-size:10px; letter-spacing:.08em; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; text-align:left; padding:0; color:inherit; font:inherit;
    display:flex; flex-direction:column; transition:border-color .12s, transform .12s;
  }
  .card:hover { border-color:var(--accent); transform:translateY(-2px);
                box-shadow:0 4px 10px rgba(90,70,45,.16); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .shot {
    aspect-ratio:4/5; background:var(--panel-2); position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  /* Fill the tile. Landscape photos - the group shots - would lose people to
     the crop, so they get .wide and go back to fitting inside. */
  .shot img { position:absolute; inset:0; width:100%; height:100%;
            object-fit:cover; object-position:50% 12%; display:block; }
  .shot img.wide { object-fit:contain; object-position:50% 50%; }
  .shot .empty { color:var(--faint); font-size:12px; letter-spacing:.08em; }
  .flag {
    position:absolute; top:8px; left:8px; width:9px; height:9px; border-radius:50%;
    box-shadow:0 0 0 3px rgba(246,239,223,.85);
  }
  .flag.good { background:var(--good); }
  .flag.bad { background:var(--bad); }
  .flag.neutral { background:var(--neutral); }
  .custom-tag, .theme-tag {
    position:absolute; top:8px; right:8px;
    background:rgba(246,239,223,.92); border:1px solid var(--line);
    font-size:10px; letter-spacing:.05em; font-weight:600;
    padding:2px 6px; border-radius:3px; max-width:calc(100% - 14px);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .custom-tag { color:var(--accent); }
  .theme-tag  { color:var(--gold); }
  .meta { padding:11px 12px 12px; }
  .meta h3 { margin:0; font-size:14.5px; font-weight:600; line-height:1.25; }
  .variant { color:var(--dim); font-size:12px; margin-top:2px; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
  .theme { color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stars { color:var(--gold); font-size:12px; letter-spacing:1px; white-space:nowrap; }
  .stars .off { color:var(--line); }

  .none { color:var(--faint); text-align:center; padding:70px 20px; }
  .none .over { display:block; margin:14px auto 0; background:var(--panel);
                border:1px solid var(--line); color:var(--dim); border-radius:var(--radius);
                padding:8px 14px; font:inherit; font-size:13px; cursor:pointer;
                letter-spacing:.05em; text-transform:uppercase; }
  .none .over:hover { border-color:var(--accent); color:var(--accent); background:var(--panel-2); }

  /* ---------- detail ---------- */
  dialog {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:var(--radius); padding:0; max-width:820px; width:calc(100% - 32px);
    max-height:88vh; overflow:auto;
    box-shadow:0 26px 70px rgba(50,36,20,.45);
  }
  dialog::backdrop { background:rgba(46,34,18,.62); }
  dialog { transition:transform .22s ease, opacity .22s ease; overscroll-behavior:contain; }
  dialog.dragging { transition:none; }
  .grab { display:none; }
  .stepbar { display:flex; align-items:center; gap:10px; margin-top:18px;
             border-top:1px solid var(--line); padding-top:14px; }
  .stepbtn { flex:1 1 0; background:var(--panel-2); border:1px solid var(--line);
             color:var(--dim); border-radius:var(--radius); padding:10px 8px;
             font:inherit; font-size:13px; cursor:pointer; }
  .stepbtn:hover { color:var(--text); border-color:var(--accent); }
  .pos { color:var(--faint); font-size:11.5px; white-space:nowrap;
         font-variant-numeric:tabular-nums; }
  .detail { display:grid; grid-template-columns:300px 1fr; gap:0; }
  .gallery { background:var(--panel-2); padding:18px;
             border-right:1px solid var(--line); }
  .gallery .main { width:100%; border-radius:var(--radius); display:block;
                   background:var(--panel); border:1px solid var(--line); }
  .gallery .main.empty { aspect-ratio:4/5; display:flex; align-items:center;
                         justify-content:center; color:var(--faint); font-size:12px; }
  .thumbs { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .thumbs img { width:48px; height:48px; object-fit:cover; border-radius:3px;
                cursor:pointer; border:2px solid transparent; }
  .thumbs img[data-on="1"] { border-color:var(--accent); }
  .info { padding:22px 24px 26px; }
  .info h2 { margin:0 0 2px; font-size:22px; letter-spacing:-.01em; }
  .info .variant { font-size:13px; margin-bottom:12px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .badge { font-size:11px; letter-spacing:.05em; padding:4px 9px; border-radius:20px;
           border:1px solid var(--line); background:var(--panel-2); color:var(--dim); }
  .badge.good { color:var(--good); border-color:color-mix(in srgb, var(--good) 40%, transparent); }
  .badge.bad { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, transparent); }
  .badge.neutral { color:var(--neutral); border-color:color-mix(in srgb, var(--neutral) 40%, transparent); }
  .badge.custom { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, transparent); }
  .info .stars { font-size:15px; margin-bottom:16px; }
  .bg { color:var(--text); white-space:pre-wrap; margin-bottom:18px; }
  .bg:empty { display:none; }
  .badge.rank { color:#3f6b48; border-color:rgba(63,107,72,.45); }
  .badge.role { color:#8a4527; border-color:rgba(138,69,39,.45); }
  .badge.loc  { color:#3c5f7d; border-color:rgba(60,95,125,.45); }
  .badge.grp  { color:#7a5a12; border-color:rgba(122,90,18,.45); }
  .prov { border-left:2px solid var(--line); padding-left:12px; margin-bottom:18px;
          color:var(--dim); font-size:13.5px; white-space:pre-wrap; }
  .prov h4 { margin:0 0 3px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
             color:var(--faint); font-weight:600; }
  .stage { position:relative; }
  .nav { position:absolute; top:50%; left:6px; transform:translateY(-50%);
         background:rgba(246,239,223,.92); border:1px solid var(--line); color:var(--text);
         width:30px; height:46px; border-radius:var(--radius); cursor:pointer;
         font-size:20px; line-height:1; padding:0; }
  .nav.next { left:auto; right:6px; }
  .nav:hover { background:var(--panel); border-color:var(--accent); color:var(--accent); }
  .counter { position:absolute; right:8px; bottom:8px; background:rgba(246,239,223,.9);
             border:1px solid var(--line);
             color:var(--dim); font-size:11px; padding:1px 8px; border-radius:3px; }
  .cap { color:var(--dim); font-size:12px; text-align:center; margin-top:7px; min-height:1em; }
  .rel { margin-bottom:18px; }
  .rel h4 { margin:0 0 6px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
            color:var(--faint); font-weight:600; }
  .minis { display:flex; flex-wrap:wrap; gap:11px; }
  .mini { width:78px; background:none; border:0; padding:0; cursor:pointer;
          text-align:center; font:inherit; }
  .minishot { display:block; width:78px; aspect-ratio:4/5; position:relative;
              background:var(--panel-2); border:1px solid var(--line);
              border-radius:var(--radius); overflow:hidden; }
  .minishot img { position:absolute; inset:0; width:100%; height:100%;
                  object-fit:cover; object-position:50% 12%; }
  .minishot img.wide { object-fit:contain; object-position:50% 50%; }
  .minidash { position:absolute; inset:0; display:flex; align-items:center;
              justify-content:center; color:var(--faint); font-size:15px; }
  .mini em { display:block; font-style:normal; font-size:9.5px; color:var(--faint);
             letter-spacing:.03em; margin-top:5px; line-height:1.3; }
  .mini b { display:block; font-size:11px; color:var(--dim); font-weight:600;
            line-height:1.25; margin-top:1px; }
  .mini:hover .minishot { border-color:var(--accent); }
  .mini:hover b { color:var(--text); }
  .mini:focus-visible .minishot { outline:2px solid var(--accent); outline-offset:2px; }
  .facts { border-top:1px solid var(--line); padding-top:14px; font-size:13px; color:var(--dim); }
  .facts div { margin-bottom:5px; }
  .facts b { color:var(--text); font-weight:500; }
  .close { position:sticky; top:10px; float:right; margin:10px 10px 0 0; z-index:2;
           background:var(--panel); border:1px solid var(--line); color:var(--dim);
           width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1; }
  .close:hover { color:var(--accent); border-color:var(--accent); }

  @media (max-width:640px) {
    .detail { grid-template-columns:1fr; }
    .grab { display:block; position:sticky; top:0; z-index:3; padding:9px 0 3px;
            background:var(--panel); text-align:center; }
    .grab::after { content:""; display:inline-block; width:38px; height:4px;
                   border-radius:2px; background:var(--line); }
    .close { margin-top:-30px; }
    .grid { grid-template-columns:repeat(3, 1fr); gap:9px; }
    .wrap { padding:14px 16px 0; }
    .rail { gap:16px; }
    .deck { padding:10px 0 60px; }
    .sides button { font-size:11px; letter-spacing:.1em; padding:7px 6px 8px; }
    .plates > h2 em { display:none; }   /* no room for the subtitle at this width */

    /* Chrome is expensive on a phone - every row here is a row of figures you
       cannot see. Title on one line, search on one line, everything else
       shoulder to shoulder on a third. */
    header { gap:9px; padding-bottom:9px; margin-bottom:10px; border-bottom-width:1px; }
    h1 { font-size:18px; }
    .count { font-size:11px; }
    .lorebtn { padding:5px 9px; font-size:11px; letter-spacing:.03em; }
    .bar { gap:6px; margin-bottom:9px; }
    .bar .search { flex:1 1 100%; padding:8px 10px; font-size:14px; }
    .bar select { flex:1 1 84px; max-width:none; min-width:0; padding:6px 6px; font-size:11.5px; }
    .shuffle, .toggle { padding:6px 8px; font-size:11px; letter-spacing:.02em; }
    .dens { flex:0 0 auto; gap:4px; padding:4px 6px; }
    .dens input { width:44px; }
    .dens b { font-size:11px; }
    .gallery { border-right:0; border-bottom:1px solid var(--line); }
    .plate { flex-basis:132px; }
    .plate b { font-size:13px; }
    .plate i { font-size:11.5px; }
    h1 { font-size:21px; }
    .meta { padding:8px 9px 10px; }
    .meta h3 { font-size:12.5px; line-height:1.2; }
    .card .variant { font-size:10.5px; }
    .row { margin-top:6px; gap:4px; }
    .theme { font-size:9px; letter-spacing:.04em; }
    .card .stars { font-size:9.5px; letter-spacing:0; }
    .custom-tag { font-size:8.5px; padding:2px 5px; }
    .card .stars .off { display:none; }   /* hide the "unrated" filler */
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>The Collection</h1>
    <span class="count" id="count"></span>
    <button class="lorebtn" id="lorebtn">World notes</button>
  </header>

  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Search name, background, tags…">
    <select id="sort" aria-label="Order">
      <option value="order">Order I added them</option>
      <option value="added">Newest first</option>
      <option value="name">Name A–Z</option>
      <option value="role">Role</option>
      <option value="theme">Theme</option>
      <option value="rating">Highest rated</option>
      <option value="shuffle">Shuffled</option>
    </select>
    <button class="shuffle" id="shuffle" title="Deal them out in a new order">Shuffle</button>
    <button class="toggle" id="filtertoggle" aria-expanded="false" aria-controls="filters">Filters</button>
    <div class="dens">
      <input id="cols" type="range" min="2" max="12" step="1" aria-label="Figures per row">
      <b id="colslabel">6</b>
    </div>
  </div>

  <div class="controls" id="filters" hidden>
    <label class="fld"><span>Made by</span><div class="seg" id="origin"></div></label>
    <label class="fld"><span>Theme</span>
      <select id="theme"><option value="all">All themes</option></select></label>
    <label class="fld"><span>Group</span>
      <select id="group"><option value="all">All groups</option></select></label>
    <label class="fld"><span>Role</span>
      <select id="role"><option value="all">All roles</option></select></label>
    <button class="clear" id="clearfilters" hidden>Clear filters</button>
  </div>

  <nav class="sides" id="sides" aria-label="Which side"></nav>

  <div class="rail" id="rail"></div>

</div>

<dialog id="detail"></dialog>

<script src="data/collection.js?v=1789515854"></script>
<script src="data/lore.js?v=1789515854"></script>
<script src="data/featured.js?v=1789515854"></script>
<script>
const FIGS = (window.COLLECTION || []).map((f, i) => ({ ...f, _i: i }));
const state = { q:"", origin:"all", theme:"all", role:"all", group:"all", sort:"order" };

// One deck per side, in this order, built from the sides actually in use - a
// Neutral deck appears by itself the day somebody is neutral.
const SIDE_ORDER = ["good", "neutral", "bad"];
const SIDE_LABEL = { good:"The Good", bad:"The Bad", neutral:"In Between" };
const SIDES = SIDE_ORDER.filter(k => FIGS.some(f => f.faction === k));

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
// images may be a plain path or {src, caption} — normalise both to objects
const photos = f => (f.images || []).map(x =>
  typeof x === "string" ? { src: x, caption: "" } : x);

// small clickable tile: photo, relation label, name
const miniCard = (g, label) => {
  const cover = photos(g)[0];
  return `<button class="mini" data-i="${g._i}">
    <span class="minishot">${cover
      ? `<img src="${esc(cover.src)}" alt="" loading="lazy">`
      : `<span class="minidash">—</span>`}</span>
    ${label ? `<em>${esc(label)}</em>` : ``}
    <b>${esc(g.name)}</b>
  </button>`;
};

const stars = n => {
  if (!n) return `<span class="off">unrated</span>`;   // don't fake a rating
  const r = Math.max(0, Math.min(5, Math.round(n)));
  return "★".repeat(r) + `<span class="off">${"★".repeat(5 - r)}</span>`;
};

// Dropdowns carry only the values actually in use, alphabetically. Rank and
// location used to have filters of their own and no longer do: rank is set on
// ten figures out of five hundred and is cosmological rather than military,
// and location mostly repeats what group and theme already say.
for (const [id, key] of [["theme","theme"], ["role","role"], ["group","group"]]) {
  [...new Set(FIGS.map(f => f[key]).filter(Boolean))].sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    $(id).append(o);
  });
}

// Side used to be a filter in this panel. It is the two decks now, so what is
// left here is the one segmented control that still has a question to answer.
const SEG_LABEL = { good:"Good", bad:"Bad", neutral:"Neutral", branded:"Branded", custom:"Custom" };
for (const [id, allLabel] of [["origin","Any"]]) {
  const ORDER = ["good", "bad", "neutral", "branded", "custom"];
  const vals = [...new Set(FIGS.map(f => f[id]).filter(Boolean))]
    .sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99)
                    || a.localeCompare(b));
  $(id).innerHTML = [["all", allLabel], ...vals.map(v => [v, SEG_LABEL[v] || v])]
    .map(([v, label], i) =>
      `<button type="button" data-v="${esc(v)}" aria-pressed="${i === 0}">${esc(label)}</button>`)
    .join("");
}

function matches(f) {
  if (state.origin  !== "all" && f.origin  !== state.origin)  return false;
  if (state.theme   !== "all" && f.theme   !== state.theme)   return false;
  if (state.role    !== "all" && f.role    !== state.role)    return false;
  if (state.group   !== "all" && f.group   !== state.group)   return false;
  if (state.q) {
    const hay = [f.name, f.variant, f.theme, f.rank, f.role, f.group, f.location, f.background, f.provenance, f.notes, (f.tags || []).join(" ")]
      .join(" ").toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

// One random key per figure, dealt fresh each time Shuffle is pressed. Sorting
// on a stored key rather than on Math.random() keeps the order stable while you
// scroll, filter and open cards - it only changes when you ask it to.
let deck = new Map();
function reshuffle() {
  deck = new Map(FIGS.map(f => [f._i, Math.random()]));
}

const SORTS = {
  rating:  (a, b) => (b.rating || 0) - (a.rating || 0) || a.name.localeCompare(b.name),
  name:    (a, b) => a.name.localeCompare(b.name),
  order:   (a, b) => a._i - b._i,
  role:    (a, b) => (a.role || "~").localeCompare(b.role || "~") || a.name.localeCompare(b.name),
  theme:   (a, b) => (a.theme || "~").localeCompare(b.theme || "~") || a.name.localeCompare(b.name),
  added:   (a, b) => b._i - a._i,
  shuffle: (a, b) => (deck.get(a._i) ?? 0) - (deck.get(b._i) ?? 0)
};

const FILTER_KEYS = ["origin", "role", "group", "theme"];

function syncFilterUI() {
  const n = FILTER_KEYS.filter(k => state[k] !== "all").length;
  const btn = $("filtertoggle");
  btn.textContent = n ? `Filters · ${n}` : "Filters";
  btn.classList.toggle("on", n > 0);       // stays visible when the panel is shut
  $("clearfilters").hidden = n === 0;
}

let decks = {};         // side -> the figures on that deck, in screen order
let curI = -1;          // _i of the figure the dialog is showing
let mode = "figure";    // "figure" | "lore"

// Built once. Each deck is its own scroller with its own plate strip, grid and
// empty state, so nothing about one side can move the other.
$("sides").innerHTML = SIDES.map((k, i) =>
  `<button type="button" data-side="${k}" aria-selected="${i === 0}">${esc(SIDE_LABEL[k] || k)}<b></b></button>`
).join("");
$("rail").innerHTML = SIDES.map(k => `<section class="deck" data-side="${k}">
    <section class="plates" id="plates-${k}" hidden>
      <h2>Plates<em>a few worth stopping on</em></h2>
      <div class="strip" id="platestrip-${k}"></div>
    </section>
    <div class="grid" id="grid-${k}"></div>
    <p class="none" id="none-${k}" hidden></p>
  </section>`).join("");

const deckEls = [...$("rail").children];
const gridEls = SIDES.map(k => $("grid-" + k));

function render() {
  const list = FIGS.filter(matches).sort(SORTS[state.sort]);
  for (const k of SIDES) decks[k] = list.filter(f => f.faction === k);

  $("count").textContent =
    list.length === FIGS.length
      ? `${FIGS.length} figure${FIGS.length === 1 ? "" : "s"}`
      : `${list.length} of ${FIGS.length}`;

  SIDES.forEach((k, i) => {
    const mine = decks[k];
    $("sides").children[i].querySelector("b").textContent = String(mine.length);

    $("grid-" + k).innerHTML = sections(mine).map((run, j) =>
      (j === 0 ? `` : `<div class="sec">${run.lost ? "Deceased or missing" : "Still here"}<b>${run.items.length}</b></div>`)
      + run.items.map(card).join("")
    ).join("");
    fitShots($("grid-" + k));

    // If this side came up empty but the other one didn't, say where they went
    // rather than leaving somebody staring at "nothing matches" with a full
    // deck one swipe away.
    const el = $("none-" + k);
    el.hidden = mine.length > 0;
    if (!el.hidden) {
      const other = SIDES.map((o, oi) => ({ o, oi, n: decks[o].length })).filter(x => x.o !== k && x.n);
      el.innerHTML = other.length
        ? `Nothing on this side.` + other.map(x =>
            `<button class="over" data-go="${x.oi}">${x.n} on ${esc(SIDE_LABEL[x.o] || x.o)} &rsaquo;</button>`).join("")
        : `Nothing matches that.`;
    }
  });

  syncFilterUI();
  renderPlates();
}

/* ---- which deck is on screen ---- */
function activeIndex() {
  const x = $("rail").scrollLeft;
  let best = 0, bd = Infinity;
  deckEls.forEach((el, i) => { const d = Math.abs(el.offsetLeft - x); if (d < bd) { bd = d; best = i; } });
  return best;
}
function goSide(i, behavior = "smooth") {
  const el = deckEls[Math.max(0, Math.min(deckEls.length - 1, i))];
  if (el) $("rail").scrollTo({ left: el.offsetLeft, behavior });
}
function syncSideUI() {
  const a = activeIndex();
  [...$("sides").children].forEach((b, i) => b.setAttribute("aria-selected", String(i === a)));
}
$("sides").addEventListener("click", e => {
  const b = e.target.closest("button[data-side]");
  if (b) goSide([...$("sides").children].indexOf(b));
});
(() => {
  let queued = false;
  $("rail").addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; syncSideUI(); condense(); });
  }, { passive: true });
})();

// Folding the header changes the rail's height, which nudges the scroll
// position, which could fold it straight back. The gap between the two
// thresholds is what stops that turning into a flicker.
function condense() {
  const el = deckEls[activeIndex()];
  if (!el) return;
  const on = document.querySelector(".wrap").classList.contains("condensed");
  const y = el.scrollTop;
  if (!on && y > 80) document.querySelector(".wrap").classList.add("condensed");
  else if (on && y < 24) document.querySelector(".wrap").classList.remove("condensed");
}
deckEls.forEach(el => {
  let queued = false;
  el.addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; condense(); });
  }, { passive: true });
});
// A resize moves every deck's offsetLeft, so hold the one you were on.
window.addEventListener("resize", () => goSide(activeIndex(), "auto"));

// The lost are catalogued as a block at the end of the collection, so the grid
// draws a rule where they start. Only when the current order actually splits
// the two apart - sorting by name or rating interleaves them, and a rule there
// would claim a division that isn't on screen.
const isLost = f => (f.tags || []).includes("lost");

function sections(list) {
  const runs = [];
  for (const f of list) {
    const lost = isLost(f);
    if (!runs.length || runs[runs.length - 1].lost !== lost) runs.push({ lost, items: [] });
    runs[runs.length - 1].items.push(f);
  }
  return runs.length === 2 ? runs : [{ lost: null, items: list }];
}

function card(f) {
    const cover = photos(f)[0];
    return `<button class="card" data-i="${f._i}">
      <div class="shot">
        ${cover ? `<img src="${esc(cover.src)}" alt="${esc(f.name)}" loading="lazy">`
                : `<span class="empty">NO PHOTO YET</span>`}
        <span class="flag ${esc(f.faction)}" title="${esc(f.faction)}"></span>
        ${f.origin === "custom"
            ? `<span class="custom-tag">CUSTOM</span>`
            : themeTag(f) ? `<span class="theme-tag">${esc(themeTag(f))}</span>` : ``}
      </div>
      <div class="meta">
        <h3>${esc(f.name)}</h3>
        ${f.variant ? `<div class="variant">${esc(f.variant)}</div>` : ``}
        <div class="row">
          <span class="theme">${esc(f.group || f.role || f.rank || "")}</span>
          <span class="stars">${stars(f.rating)}</span>
        </div>
      </div>
    </button>`;
}

// The plate strip is a landing feature: it shows the hand-picked run while you
// are looking at the whole catalogue, and gets out of the way the moment you
// search or filter, because then you are looking for something specific.
const PLATES = (window.FEATURED || [])
  .map(p => ({ ...p, fig: FIGS.find(f => f.id === p.id) }))
  .filter(p => p.fig);

// Each plate sits on the deck its figure belongs to, so the good side opens on
// its own picks and the bad side on its own.
const platesDrawn = {};
function renderPlates() {
  const idle = !state.q && FILTER_KEYS.every(k => state[k] === "all");
  for (const k of SIDES) {
    const mine = PLATES.filter(p => p.fig.faction === k);
    $("plates-" + k).hidden = !idle || mine.length === 0;
    if (!idle || platesDrawn[k] || !mine.length) continue;
    $("platestrip-" + k).innerHTML = mine.map(p => {
      const cover = photos(p.fig)[0];
      return `<button class="plate" data-i="${p.fig._i}">
        <span class="frame">${cover
          ? `<img src="${esc(cover.src)}" alt="" loading="lazy">`
          : `<span class="minidash">—</span>`}</span>
        <b>${esc(p.fig.name)}</b>
        <i>${esc(p.why || "")}</i>
      </button>`;
    }).join("");
    fitShots($("platestrip-" + k));
    platesDrawn[k] = true;
  }
}

// Short labels for the corner tag - a few franchise names are far too long to
// sit on a card, so they get an abbreviation. Anything not listed is used whole.
const THEME_TAG = {
  "The Nightmare Before Christmas": "NIGHTMARE",
  "Pirates of the Caribbean": "PIRATES",
  "Avatar: The Last Airbender": "AVATAR",
  "SpongeBob SquarePants": "SPONGEBOB",
  "Legends of Chima": "CHIMA",
  "Indiana Jones": "INDIANA",
  "Harry Potter": "POTTER",
  "Dragon Ball": "DRAGONBALL",
};
function themeTag(f) {
  if (!f.theme || f.theme === "Creation Mythos") return "";
  return (THEME_TAG[f.theme] || f.theme).toUpperCase();
}

// Photos fill their tile, but a landscape one - the group shots - would have
// people cropped off the sides, so those are marked and fit inside instead.
function markWide(img) {
  if (img.naturalWidth && img.naturalHeight) {
    img.classList.toggle("wide", img.naturalWidth > img.naturalHeight);
  }
}
function fitShots(root) {
  if (!root) return;
  root.querySelectorAll(".shot img, .minishot img, .plate .frame img").forEach(img => {
    if (img.complete) markWide(img);
    else img.addEventListener("load", () => markWide(img), { once: true });
  });
}

let gal = { imgs: [], i: 0 };

// Show photo n of the open figure, wrapping at both ends.
function showImg(n) {
  if (!gal.imgs.length) return;
  gal.i = (n + gal.imgs.length) % gal.imgs.length;
  const cur = gal.imgs[gal.i];
  $("main").src = cur.src;
  if ($("cap"))     $("cap").textContent = cur.caption || "";
  if ($("counter")) $("counter").textContent = `${gal.i + 1} / ${gal.imgs.length}`;
  $("detail").querySelectorAll(".thumbs img")
    .forEach((t, i) => t.dataset.on = i === gal.i ? "1" : "0");
}

// Which list do next/previous walk? The deck this figure is actually on, so
// stepping never crosses sides mid-read. A figure reached from a Connections
// tile that is filtered out of every deck falls back to the whole collection.
function navList() {
  for (const k of SIDES) if (decks[k] && decks[k].some(f => f._i === curI)) return decks[k];
  return FIGS;
}

function stepFigure(d) {
  if (mode !== "figure") return;
  const list = navList();
  if (!list.length) return;
  const at = list.findIndex(f => f._i === curI);
  open(list[((at < 0 ? 0 : at) + d + list.length) % list.length]);
}

function open(f) {
  mode = "figure";
  curI = f._i;
  gal = { imgs: photos(f), i: 0 };
  const many = gal.imgs.length > 1;
  const list = navList();
  const at = list.findIndex(x => x._i === f._i);
  $("detail").innerHTML = `
    <div class="grab"></div>
    <button class="close" id="x" aria-label="Close">&times;</button>
    <div class="detail">
      <div class="gallery">
        ${gal.imgs.length ? `
          <div class="stage">
            <img class="main" id="main" alt="${esc(f.name)}">
            ${many ? `
              <button class="nav" data-step="-1" aria-label="Previous photo">&lsaquo;</button>
              <button class="nav next" data-step="1" aria-label="Next photo">&rsaquo;</button>
              <span class="counter" id="counter"></span>` : ``}
          </div>
          <div class="cap" id="cap"></div>
          ${many ? `<div class="thumbs">${gal.imgs.map(g =>
              `<img src="${esc(g.src)}" alt="">`).join("")}</div>` : ``}
        ` : `<div class="main empty">NO PHOTO YET</div>`}
      </div>
      <div class="info">
        <h2>${esc(f.name)}</h2>
        ${f.variant ? `<div class="variant">${esc(f.variant)}</div>` : ``}
        <div class="badges">
          <span class="badge ${esc(f.faction)}">${esc((f.faction || "").toUpperCase())}</span>
          <span class="badge ${f.origin === "custom" ? "custom" : ""}">${esc((f.origin || "").toUpperCase())}</span>
          ${f.rank ? `<span class="badge rank">${esc(f.rank)}</span>` : ``}
          ${f.role ? `<span class="badge role">${esc(f.role)}</span>` : ``}
          ${f.group ? `<span class="badge grp">${esc(f.group)}</span>` : ``}
          ${f.location ? `<span class="badge loc">${esc(f.location)}</span>` : ``}
          ${f.theme ? `<span class="badge">${esc(f.theme)}</span>` : ``}
          ${(f.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join("")}
        </div>
        <div class="stars">${stars(f.rating)}</div>
        <div class="bg">${esc(f.background || "")}</div>
        ${f.provenance ? `<div class="prov"><h4>How I got it</h4>${esc(f.provenance)}</div>` : ``}
        ${(() => {
          // One section. People this figure has actually had something to do with:
          // stated relationships first, then the rest of whatever they belong to.
          // Shared job title is NOT a connection - two soldiers who never met
          // are not connected, so `role` does not feed this at all.
          const rels = (f.relations || [])
            .map(r => ({ g: FIGS.find(x => x.id === r.to), label: r.label }))
            .filter(r => r.g);
          const seen = new Set(rels.map(r => r.g._i));
          const fam = f.group
            ? FIGS.filter(g => g.group === f.group && g._i !== f._i && !seen.has(g._i))
                  .map(g => ({ g, label: g.role || f.group }))
            : [];
          const all = rels.concat(fam);
          return all.length ? `<div class="rel"><h4>Connections</h4>
            <div class="minis">${all.map(r => miniCard(r.g, r.label)).join("")}</div>
          </div>` : ``;
        })()}
        ${(f.acquired || f.notes) ? `<div class="facts">
          ${f.acquired ? `<div><b>Acquired</b> — ${esc(f.acquired)}</div>` : ``}
          ${f.notes ? `<div><b>Notes</b> — ${esc(f.notes)}</div>` : ``}
        </div>` : ``}
        <div class="stepbar">
          <button class="stepbtn" data-fig="-1">&lsaquo; Previous</button>
          <span class="pos">${at >= 0 ? at + 1 : "\u2013"} of ${list.length}</span>
          <button class="stepbtn" data-fig="1">Next &rsaquo;</button>
        </div>
      </div>
    </div>`;
  if (!$("detail").open) $("detail").showModal();
  $("detail").scrollTop = 0;
  fitShots($("detail"));
  showImg(0);
}

function openLore() {
  mode = "lore";
  gal = { imgs: [], i: 0 };            // no gallery here
  $("detail").innerHTML = `
    <div class="grab"></div>
    <button class="close" id="x" aria-label="Close">&times;</button>
    <div class="lore">
      <h2>World notes</h2>
      ${(window.LORE || []).map(n => `
        <section>
          <h3>${esc(n.title)}</h3>
          <p>${esc(n.text)}</p>
        </section>`).join("")}
    </div>`;
  if (!$("detail").open) $("detail").showModal();
  $("detail").scrollTop = 0;
}

// ---- events ----
$("lorebtn").addEventListener("click", openLore);
$("rail").addEventListener("click", e => {
  const hit = e.target.closest(".card, .plate");
  if (hit) return open(FIGS[+hit.dataset.i]);
  const over = e.target.closest(".none .over");
  if (over) return goSide(Number(over.dataset.go));
});

$("detail").addEventListener("click", e => {
  if (e.target.id === "x") return $("detail").close();
  const mini = e.target.closest(".mini");
  if (mini) return open(FIGS[+mini.dataset.i]);
  const nav = e.target.closest(".nav");
  if (nav) return showImg(gal.i + Number(nav.dataset.step));
  const t = e.target.closest(".thumbs img");
  if (t) return showImg([...t.parentNode.children].indexOf(t));
  const step = e.target.closest(".stepbtn");
  if (step) return stepFigure(Number(step.dataset.fig));
});

// On document, not on the dialog: stepping to another figure replaces the
// dialog's contents, which throws focus back out to the body and would
// otherwise kill the arrow keys after the first press.
document.addEventListener("keydown", e => {
  if (!$("detail").open) return;
  if (e.key === "ArrowRight") { e.preventDefault(); showImg(gal.i + 1); }   // photos
  if (e.key === "ArrowLeft")  { e.preventDefault(); showImg(gal.i - 1); }
  if (e.key === "ArrowDown")  { e.preventDefault(); stepFigure(1); }        // figures
  if (e.key === "ArrowUp")    { e.preventDefault(); stepFigure(-1); }
});

/* ---- touch: drag down to dismiss, swipe sideways for the next figure ----
   Vertical gestures only take over at the very top (drag it away) or the very
   bottom (on to the next), so ordinary scrolling still works in between. */
(() => {
  const dlg = $("detail");
  let g = null;
  const atTop = () => dlg.scrollTop <= 0;
  const atEnd = () => dlg.scrollTop + dlg.clientHeight >= dlg.scrollHeight - 2;

  dlg.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { g = null; return; }
    const t = e.touches[0];
    g = { x: t.clientX, y: t.clientY, top: atTop(), end: atEnd(), kind: null };
  }, { passive: true });

  dlg.addEventListener("touchmove", e => {
    if (!g || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (!g.kind) {
      if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.4) g.kind = "side";
      else if (Math.abs(dy) > 14) {
        g.kind = dy > 0 ? (g.top ? "dismiss" : "scroll")
                        : (g.end ? "onward" : "scroll");
      }
    }
    if (g.kind === "dismiss") {
      e.preventDefault();
      dlg.classList.add("dragging");
      dlg.style.transform = `translateY(${Math.max(0, dy)}px)`;
      dlg.style.opacity = String(Math.max(.3, 1 - dy / 480));
    } else if (g.kind === "side" || g.kind === "onward") {
      e.preventDefault();
    }
  }, { passive: false });

  const settle = () => {
    dlg.classList.remove("dragging");
    dlg.style.transform = "";
    dlg.style.opacity = "";
  };

  dlg.addEventListener("touchend", e => {
    if (!g) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - g.x, dy = t.clientY - g.y;
    const kind = g.kind; g = null;
    settle();
    if (kind === "dismiss" && dy > 90) return dlg.close();
    if (kind === "onward" && dy < -70) return stepFigure(1);
    if (kind === "side" && Math.abs(dx) > 55) return stepFigure(dx < 0 ? 1 : -1);
  });

  dlg.addEventListener("touchcancel", () => { g = null; settle(); });
})();

/* ---- how many figures across ---- */
let cols = 6;

// How much text a card can carry depends on how wide it actually ends up,
// which is the column count AND the screen. Seven across is comfortable on a
// laptop and unreadable on a phone, so measure rather than guess.
function fitText() {
  for (const grid of gridEls) {
    const gap = parseFloat(getComputedStyle(grid).gap) || 0;
    const card = (grid.clientWidth - gap * (cols - 1)) / cols;
    grid.classList.toggle("small", card < 100 && card >= 78);
    grid.classList.toggle("tiny", card < 78);
  }
}

function applyCols(n) {
  cols = n;
  for (const grid of gridEls) {
    grid.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
    grid.style.gap = n >= 9 ? "5px" : n >= 6 ? "8px" : n >= 4 ? "11px" : "16px";
  }
  fitText();
  $("colslabel").textContent = String(n);
  try { localStorage.setItem("lego.cols", String(n)); } catch (_) {}
}

(() => {
  let n = 0;
  try { n = Number(localStorage.getItem("lego.cols")) || 0; } catch (_) {}
  if (!n) n = window.matchMedia("(max-width:640px)").matches ? 3 : 6;
  n = Math.max(2, Math.min(12, n));
  $("cols").value = String(n);
  applyCols(n);
})();

$("cols").addEventListener("input", e => applyCols(Number(e.target.value)));
window.addEventListener("resize", fitText);

$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("theme").addEventListener("change", e => { state.theme = e.target.value; render(); });
$("role").addEventListener("change", e => { state.role = e.target.value; render(); });
$("group").addEventListener("change", e => { state.group = e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

["origin"].forEach(key => {
  $(key).addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    state[key] = b.dataset.v;
    [...$(key).children].forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
});

$("filtertoggle").addEventListener("click", () => {
  const open = $("filters").hidden;
  $("filters").hidden = !open;
  $("filtertoggle").setAttribute("aria-expanded", String(open));
  fitText();
});

$("clearfilters").addEventListener("click", () => {
  FILTER_KEYS.forEach(k => state[k] = "all");
  ["role", "group", "theme"].forEach(id => $(id).value = "all");
  [...$("origin").children].forEach((c, i) => c.setAttribute("aria-pressed", String(i === 0)));
  render();
});

$("shuffle").addEventListener("click", () => {
  reshuffle();
  state.sort = "shuffle";
  $("sort").value = "shuffle";
  render();
  deckEls[activeIndex()].scrollTo({ top: 0, behavior: "smooth" });
});

// Left and right step between the sides while nothing is open and you are not
// typing in the search box.
document.addEventListener("keydown", e => {
  if ($("detail").open) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const t = document.activeElement;
  if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
  e.preventDefault();
  goSide(activeIndex() + (e.key === "ArrowRight" ? 1 : -1));
});

reshuffle();
render();
syncSideUI();
</script>
</body>
