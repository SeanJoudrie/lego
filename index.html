<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collection</title>
<style>
  :root {
    --bg:#12141a; --panel:#191c24; --panel-2:#212632; --line:#2c3140;
    --text:#e7e9ef; --dim:#9299ab; --faint:#666e82;
    --good:#4da3ff; --bad:#ff5f56; --neutral:#b28cff;
    --gold:#ffc531; --accent:#ffc531;
    --radius:12px;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1400px; margin:0 auto; padding:28px 20px 80px; }

  /* ---------- header ---------- */
  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  h1 { font-size:26px; margin:0; letter-spacing:-.02em; }
  .count { color:var(--faint); font-size:13px; }

  /* ---------- controls ---------- */
  .controls {
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; margin-bottom:22px;
  }
  .search {
    flex:1 1 220px; min-width:0;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 11px; font:inherit; font-size:14px;
  }
  .search::placeholder { color:var(--faint); }
  .search:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  select {
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 9px; font:inherit; font-size:13px;
  }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button {
    background:var(--panel-2); border:0; border-right:1px solid var(--line);
    color:var(--dim); padding:8px 13px; font:inherit; font-size:13px; cursor:pointer;
  }
  .seg button:last-child { border-right:0; }
  .seg button:hover { color:var(--text); }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#1a1a1a; font-weight:600; }

  /* ---------- grid ---------- */
  .grid {
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; text-align:left; padding:0; color:inherit; font:inherit;
    display:flex; flex-direction:column; transition:border-color .12s, transform .12s;
  }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .shot {
    aspect-ratio:4/5; background:var(--panel-2); position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .shot img { position:absolute; inset:0; width:100%; height:100%;
            object-fit:contain; display:block; }
  .shot .empty { color:var(--faint); font-size:12px; letter-spacing:.08em; }
  .flag {
    position:absolute; top:8px; left:8px; width:9px; height:9px; border-radius:50%;
    box-shadow:0 0 0 3px rgba(0,0,0,.45);
  }
  .flag.good { background:var(--good); }
  .flag.bad { background:var(--bad); }
  .flag.neutral { background:var(--neutral); }
  .custom-tag {
    position:absolute; top:8px; right:8px; background:rgba(0,0,0,.7);
    color:var(--accent); font-size:10px; letter-spacing:.09em; font-weight:600;
    padding:3px 7px; border-radius:5px;
  }
  .meta { padding:11px 12px 12px; }
  .meta h3 { margin:0; font-size:14.5px; font-weight:600; line-height:1.25; }
  .variant { color:var(--dim); font-size:12px; margin-top:2px; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
  .theme { color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stars { color:var(--gold); font-size:12px; letter-spacing:1px; white-space:nowrap; }
  .stars .off { color:#3a4052; }

  .none { color:var(--faint); text-align:center; padding:70px 20px; }

  /* ---------- detail ---------- */
  dialog {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:14px; padding:0; max-width:820px; width:calc(100% - 32px);
    max-height:88vh; overflow:auto;
  }
  dialog::backdrop { background:rgba(0,0,0,.75); }
  .detail { display:grid; grid-template-columns:300px 1fr; gap:0; }
  .gallery { background:var(--panel-2); padding:18px; }
  .gallery .main { width:100%; border-radius:8px; display:block; background:#0d0f14; }
  .gallery .main.empty { aspect-ratio:4/5; display:flex; align-items:center;
                         justify-content:center; color:var(--faint); font-size:12px; }
  .thumbs { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .thumbs img { width:48px; height:48px; object-fit:cover; border-radius:5px;
                cursor:pointer; border:2px solid transparent; }
  .thumbs img[data-on="1"] { border-color:var(--accent); }
  .info { padding:22px 24px 26px; }
  .info h2 { margin:0 0 2px; font-size:22px; letter-spacing:-.01em; }
  .info .variant { font-size:13px; margin-bottom:12px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .badge { font-size:11px; letter-spacing:.05em; padding:4px 9px; border-radius:20px;
           border:1px solid var(--line); background:var(--panel-2); color:var(--dim); }
  .badge.good { color:var(--good); border-color:color-mix(in srgb, var(--good) 40%, transparent); }
  .badge.bad { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, transparent); }
  .badge.neutral { color:var(--neutral); border-color:color-mix(in srgb, var(--neutral) 40%, transparent); }
  .badge.custom { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, transparent); }
  .info .stars { font-size:15px; margin-bottom:16px; }
  .bg { color:#c8cddb; white-space:pre-wrap; margin-bottom:18px; }
  .bg:empty { display:none; }
  .badge.rank { color:#7fe0a8; border-color:rgba(127,224,168,.4); }
  .badge.role { color:#ffb3d1; border-color:rgba(255,179,209,.4); }
  .badge.loc  { color:#8fc9ff; border-color:rgba(143,201,255,.4); }
  .prov { border-left:2px solid var(--line); padding-left:12px; margin-bottom:18px;
          color:var(--dim); font-size:13.5px; white-space:pre-wrap; }
  .prov h4 { margin:0 0 3px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
             color:var(--faint); font-weight:600; }
  .stage { position:relative; }
  .nav { position:absolute; top:50%; left:6px; transform:translateY(-50%);
         background:rgba(0,0,0,.62); border:1px solid var(--line); color:var(--text);
         width:30px; height:46px; border-radius:6px; cursor:pointer;
         font-size:20px; line-height:1; padding:0; }
  .nav.next { left:auto; right:6px; }
  .nav:hover { background:rgba(0,0,0,.88); border-color:var(--accent); }
  .counter { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.68);
             color:var(--dim); font-size:11px; padding:2px 8px; border-radius:10px; }
  .cap { color:var(--dim); font-size:12px; text-align:center; margin-top:7px; min-height:1em; }
  .facts { border-top:1px solid var(--line); padding-top:14px; font-size:13px; color:var(--dim); }
  .facts div { margin-bottom:5px; }
  .facts b { color:var(--text); font-weight:500; }
  .close { position:sticky; top:10px; float:right; margin:10px 10px 0 0; z-index:2;
           background:rgba(0,0,0,.6); border:1px solid var(--line); color:var(--dim);
           width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1; }
  .close:hover { color:var(--text); }

  @media (max-width:640px) {
    .detail { grid-template-columns:1fr; }
    .grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>The Collection</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search name, background, tags…">
    <div class="seg" id="faction">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="good">Good</button>
      <button data-v="bad">Bad</button>
      <button data-v="neutral">Neutral</button>
    </div>
    <div class="seg" id="origin">
      <button data-v="all" aria-pressed="true">Any</button>
      <button data-v="branded">Branded</button>
      <button data-v="custom">Custom</button>
    </div>
    <select id="rank"><option value="all">All ranks</option></select>
    <select id="role"><option value="all">All roles</option></select>
    <select id="location"><option value="all">Everywhere</option></select>
    <select id="theme"><option value="all">All themes</option></select>
    <select id="sort">
      <option value="rank">Rank</option>
      <option value="role">Role</option>
      <option value="rating">Highest rated</option>
      <option value="name">Name A–Z</option>
      <option value="theme">Theme</option>
      <option value="added">Recently added</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <p class="none" id="none" hidden>Nothing matches that.</p>

</div>

<dialog id="detail"></dialog>

<script src="data/collection.js"></script>
<script>
const FIGS = (window.COLLECTION || []).map((f, i) => ({ ...f, _i: i }));
const state = { q:"", faction:"all", origin:"all", theme:"all", rank:"all", role:"all", location:"all", sort:"rank" };
const RANKS = window.RANKS || [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
// images may be a plain path or {src, caption} — normalise both to objects
const photos = f => (f.images || []).map(x =>
  typeof x === "string" ? { src: x, caption: "" } : x);

const stars = n => {
  if (!n) return `<span class="off">unrated</span>`;   // don't fake a rating
  const r = Math.max(0, Math.min(5, Math.round(n)));
  return "★".repeat(r) + `<span class="off">${"★".repeat(5 - r)}</span>`;
};

// rank dropdown, ordered by window.RANKS (not alphabetically)
const usedRanks = new Set(FIGS.map(f => f.rank).filter(Boolean));
RANKS.filter(r => usedRanks.has(r))
  .concat([...usedRanks].filter(r => !RANKS.includes(r)).sort())
  .forEach(r => {
    const o = document.createElement("option");
    o.value = r; o.textContent = r;
    $("rank").append(o);
  });

// theme / role / location dropdowns — alphabetical, only values actually in use
for (const [id, key] of [["theme","theme"], ["role","role"], ["location","location"]]) {
  [...new Set(FIGS.map(f => f[key]).filter(Boolean))].sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    $(id).append(o);
  });
}

function matches(f) {
  if (state.faction !== "all" && f.faction !== state.faction) return false;
  if (state.origin  !== "all" && f.origin  !== state.origin)  return false;
  if (state.theme   !== "all" && f.theme   !== state.theme)   return false;
  if (state.rank    !== "all" && f.rank    !== state.rank)    return false;
  if (state.role    !== "all" && f.role    !== state.role)    return false;
  if (state.location!== "all" && f.location!== state.location)return false;
  if (state.q) {
    const hay = [f.name, f.variant, f.theme, f.rank, f.role, f.location, f.character, f.background, f.provenance, f.notes, (f.tags || []).join(" ")]
      .join(" ").toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

const rankPos = f => { const i = RANKS.indexOf(f.rank); return i < 0 ? 999 : i; };

const SORTS = {
  rating: (a, b) => (b.rating || 0) - (a.rating || 0) || a.name.localeCompare(b.name),
  name:   (a, b) => a.name.localeCompare(b.name),
  rank:   (a, b) => rankPos(a) - rankPos(b)
                    || (a.role || "~").localeCompare(b.role || "~")
                    || a.name.localeCompare(b.name),
  role:   (a, b) => (a.role || "~").localeCompare(b.role || "~") || a.name.localeCompare(b.name),
  theme:  (a, b) => (a.theme || "~").localeCompare(b.theme || "~") || a.name.localeCompare(b.name),
  added:  (a, b) => b._i - a._i
};

function render() {
  const list = FIGS.filter(matches).sort(SORTS[state.sort]);
  $("count").textContent =
    list.length === FIGS.length
      ? `${FIGS.length} figure${FIGS.length === 1 ? "" : "s"}`
      : `${list.length} of ${FIGS.length}`;
  $("none").hidden = list.length > 0;

  $("grid").innerHTML = list.map(f => {
    const cover = photos(f)[0];
    return `<button class="card" data-i="${f._i}">
      <div class="shot">
        ${cover ? `<img src="${esc(cover.src)}" alt="${esc(f.name)}" loading="lazy">`
                : `<span class="empty">NO PHOTO YET</span>`}
        <span class="flag ${esc(f.faction)}" title="${esc(f.faction)}"></span>
        ${f.origin === "custom" ? `<span class="custom-tag">CUSTOM</span>` : ``}
      </div>
      <div class="meta">
        <h3>${esc(f.name)}</h3>
        ${f.variant ? `<div class="variant">${esc(f.variant)}</div>` : ``}
        <div class="row">
          <span class="theme">${esc(f.role || f.rank || f.theme || "")}</span>
          <span class="stars">${stars(f.rating)}</span>
        </div>
      </div>
    </button>`;
  }).join("");
}

let gal = { imgs: [], i: 0 };

// Show photo n of the open figure, wrapping at both ends.
function showImg(n) {
  if (!gal.imgs.length) return;
  gal.i = (n + gal.imgs.length) % gal.imgs.length;
  const cur = gal.imgs[gal.i];
  $("main").src = cur.src;
  if ($("cap"))     $("cap").textContent = cur.caption || "";
  if ($("counter")) $("counter").textContent = `${gal.i + 1} / ${gal.imgs.length}`;
  $("detail").querySelectorAll(".thumbs img")
    .forEach((t, i) => t.dataset.on = i === gal.i ? "1" : "0");
}

function open(f) {
  gal = { imgs: photos(f), i: 0 };
  const many = gal.imgs.length > 1;
  $("detail").innerHTML = `
    <button class="close" id="x" aria-label="Close">&times;</button>
    <div class="detail">
      <div class="gallery">
        ${gal.imgs.length ? `
          <div class="stage">
            <img class="main" id="main" alt="${esc(f.name)}">
            ${many ? `
              <button class="nav" data-step="-1" aria-label="Previous photo">&lsaquo;</button>
              <button class="nav next" data-step="1" aria-label="Next photo">&rsaquo;</button>
              <span class="counter" id="counter"></span>` : ``}
          </div>
          <div class="cap" id="cap"></div>
          ${many ? `<div class="thumbs">${gal.imgs.map(g =>
              `<img src="${esc(g.src)}" alt="">`).join("")}</div>` : ``}
        ` : `<div class="main empty">NO PHOTO YET</div>`}
      </div>
      <div class="info">
        <h2>${esc(f.name)}</h2>
        ${f.variant ? `<div class="variant">${esc(f.variant)}</div>` : ``}
        <div class="badges">
          <span class="badge ${esc(f.faction)}">${esc((f.faction || "").toUpperCase())}</span>
          <span class="badge ${f.origin === "custom" ? "custom" : ""}">${esc((f.origin || "").toUpperCase())}</span>
          ${f.rank ? `<span class="badge rank">${esc(f.rank)}</span>` : ``}
          ${f.role ? `<span class="badge role">${esc(f.role)}</span>` : ``}
          ${f.location ? `<span class="badge loc">${esc(f.location)}</span>` : ``}
          ${f.theme ? `<span class="badge">${esc(f.theme)}</span>` : ``}
          ${(f.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join("")}
        </div>
        <div class="stars">${stars(f.rating)}</div>
        <div class="bg">${esc(f.background || "")}</div>
        ${f.provenance ? `<div class="prov"><h4>How I got it</h4>${esc(f.provenance)}</div>` : ``}
        ${(f.acquired || f.notes) ? `<div class="facts">
          ${f.acquired ? `<div><b>Acquired</b> — ${esc(f.acquired)}</div>` : ``}
          ${f.notes ? `<div><b>Notes</b> — ${esc(f.notes)}</div>` : ``}
        </div>` : ``}
      </div>
    </div>`;
  $("detail").showModal();
  showImg(0);
}

// ---- events ----
$("grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) open(FIGS[+card.dataset.i]);
});

$("detail").addEventListener("click", e => {
  if (e.target.id === "x") return $("detail").close();
  const nav = e.target.closest(".nav");
  if (nav) return showImg(gal.i + Number(nav.dataset.step));
  const t = e.target.closest(".thumbs img");
  if (t) return showImg([...t.parentNode.children].indexOf(t));
});

$("detail").addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); showImg(gal.i + 1); }
  if (e.key === "ArrowLeft")  { e.preventDefault(); showImg(gal.i - 1); }
});

$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("theme").addEventListener("change", e => { state.theme = e.target.value; render(); });
$("rank").addEventListener("change", e => { state.rank = e.target.value; render(); });
$("location").addEventListener("change", e => { state.location = e.target.value; render(); });
$("role").addEventListener("change", e => { state.role = e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

["faction", "origin"].forEach(key => {
  $(key).addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    state[key] = b.dataset.v;
    [...$(key).children].forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
});

render();
</script>
</body>
</html>
